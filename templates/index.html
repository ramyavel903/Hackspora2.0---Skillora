<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ScamCheck - Opportunity Verification</title>
</head>

<body>

    <h1>ScamCheck</h1>

    <h2>Opportunity Verification</h2>

    <p>
        Analyze internship and job opportunities for suspicious indicators.
    </p>

    <form action="/check" method="POST">

        <label>Company Name:</label><br>
        <input type="text" name="company" placeholder="Enter company name" required>

        <br><br>

        <label>Opportunity Type:</label><br>
        <select name="type">
            <option value="Internship">Internship</option>
            <option value="Job">Job</option>
            <option value="Freelance">Freelance</option>
            <option value="Other">Other</option>
        </select>

        <br><br>

        <label>Contact Email:</label><br>
        <input type="email" name="email" placeholder="example@company.com">

        <br><br>

        <label>Website / URL:</label><br>
        <input type="text" name="url" placeholder="https://example.com">

        <br><br>

        <label>Opportunity Details:</label><br>
        <textarea
            name="description"
            rows="10"
            cols="60"
            placeholder="Paste the WhatsApp message, email, or job description here..."
            required
        ></textarea>

        <br><br>

        <label>Is payment required?</label><br>

        <input type="radio" name="payment" value="Yes">
        <label>Yes</label>

        <input type="radio" name="payment" value="No" checked>
        <label>No</label>

        <br><br>

        <button type="submit">
            Check Opportunity
        </button>

    </form>

</body>
</html>
